services:
  - type: web
    name: vidsnap-backend-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_SERVER_HOST
        value: 0.0.0.0
      - key: APP_SERVER_PORT
        value: '8000'
      - key: APP_LOGGING_LEVEL
        value: INFO
      - key: APP_SECURITY_CORS_ORIGINS
        value: "*"
      - key: APP_SECURITY_ALLOW_DEGRADED_START
        value: "true"
      - key: APP_YOUTUBE_ENABLED
        value: "true"